<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="flybookBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0044ff" />
      <stop offset="100%" stop-color="#002299" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Background -->
  <rect width="64" height="64" rx="14" fill="url(#flybookBg)" />
  
  <!-- White Supersonic Paper Plane Symbol from Flybook Logo -->
  <polygon points="12,38 46,12 40,52 30,38" fill="#ffffff" />
  
  <!-- Shadow fold on paper plane -->
  <polygon points="30,38 46,12 37,39" fill="#e2e8f0" />
  
  <!-- 'fly' mark inside the plane -->
  <text x="24" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" fill="#002277" letter-spacing="-0.5">fly</text>
</svg>